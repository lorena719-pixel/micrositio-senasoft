{% extends "competidores/base.html" %}

{% block title %}Inscripción | Senasoft{% endblock %}

{% block content %}
<section class="encabezado-pagina">
    <p class="etiqueta">Participantes</p>
    <h1>Inscribir competidor</h1>
    <p>Completa los datos para registrar la participación en Senasoft.</p>
</section>

<section class="tarjeta formulario-tarjeta">
    <form method="POST" class="formulario">
        {% csrf_token %}

        <div class="campo">
            <label for="nombre">Nombre del competidor</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej. María Pérez"
                maxlength="120"
                required
            >
        </div>

        <div class="campo">
            <label for="centro">Centro de formación</label>
            <input
                type="text"
                id="centro"
                name="centro"
                placeholder="Ej. Centro de Gestión de Mercados"
                maxlength="160"
                required
            >
        </div>

        <div class="campo">
            <label for="categoria">Categoría</label>
            <input
                type="text"
                id="categoria"
                name="categoria"
                placeholder="Ej. Desarrollo de software"
                maxlength="120"
                required
            >
        </div>

        <button class="boton boton-principal" type="submit">
            Guardar inscripción
        </button>
    </form>
</section>
{% endblock %}
