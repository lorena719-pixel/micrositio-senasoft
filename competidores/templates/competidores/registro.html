<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de competidor</title>
</head>
<body>
    <h1>Registrar competidor</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="nombre">Nombre del competidor:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="centro">Nombre del centro:</label>
        <input type="text" id="centro" name="centro" required>
        <br><br>

        <label for="categoria">Nombre de la categoría:</label>
        <input type="text" id="categoria" name="categoria" required>
        <br><br>

        <button type="submit">Guardar inscripción</button>
    </form>

    <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>
</body>
</html>
